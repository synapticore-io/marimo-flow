version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Floors in pyproject.toml track the tested uv.lock versions, so bump the
    # lower bound together with the lock; ci.yml's lowest-direct job then
    # tests exactly the new floor.
    versioning-strategy: "increase"
    # Skip releases younger than a few days: fresh uploads are the ones most
    # likely to be broken or compromised.
    cooldown:
      default-days: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
