name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Release gate: nothing is built or published unless the full CI passes,
  # including the lockfile-free wheel install that pip users get.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Distribution
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          project_version=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi

      - name: Build package
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/marimo-flow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # required for `gh workflow run docker-publish.yml`
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} dist/* --clobber
          else
            gh release create ${{ github.ref_name }} \
              --title "Release ${{ steps.version.outputs.VERSION }}" \
              --generate-notes \
              dist/*
          fi

      - name: Trigger docker-publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-publish.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
