name: Deploy Marimo Notebooks to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "examples/**/*.py"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Static export, not html-wasm: the notebooks need torch/PINA, which
      # Pyodide cannot provide. marimo runs each notebook once here and
      # embeds the outputs; 02 (local provenance DB) and lab (LLM chat) are
      # skipped because they have nothing meaningful to render statically.
      # Code is left out (linked from the index); warnings would otherwise
      # land in the cell outputs, including runner paths.
      - name: Export notebooks to static HTML
        env:
          PYTHONWARNINGS: ignore
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -e
          mkdir -p _site
          for name in 01_pina_poisson_solver 03_navier_stokes_3d_cavity 04_mpc_heat_rod; do
            uv run marimo export html "examples/$name.py" -o "_site/$name.html" --no-include-code --no-sandbox -f
          done
          cp site/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
